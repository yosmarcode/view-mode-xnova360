<!doctype html>
<html lang="en">

<head>
  <title>Xnova360 | VISTA 360 AR</title>
  <meta charset="utf-8">
  <meta name="description" content="&lt;model-viewer&gt; template">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link type="text/css" href="./styles.css" rel="stylesheet" />
  <script type="module" src="./lib/model-viewer.min.js"></script>
</head>

<body>
  <model-viewer src="" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral"
    poster="./assets/logo_xnova360.png" shadow-intensity="1.5" environment-image="./assets/aircraft_workshop_01_1k.hdr"
    exposure="1.3" crossorigin="anonymous">
    <div class="progress-bar hide" slot="progress-bar">
      <div class="update-bar"></div>
    </div>
    <button slot="ar-button" id="ar-button">
      AR vista 360
    </button>
    <div id="ar-prompt">
      <img src="./assets/ar_hand_prompt.png">
    </div>
  </model-viewer>
  <script src="script.js"></script>

</body>

</html>
